title: Registry Run Key Persistence
id: b8363dda-e95a-43d9-ae94-f6f6cb65258b
status: experimental
description: Detects creation or modification of autorun Run/RunOnce registry keys (Sysmon EID 13), used
  for persistence at logon.
references:
- https://attack.mitre.org/techniques/T1547/001/
author: AlertMind capstone
date: 2026/06/26
tags:
- attack.persistence
- attack.t1547.001
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains:
    - \CurrentVersion\Run\
    - \CurrentVersion\RunOnce\
  condition: selection
falsepositives:
- Installers and legitimate software add Run keys; baseline expected entries
level: medium
