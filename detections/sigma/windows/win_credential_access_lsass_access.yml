title: LSASS Process Access (Credential Dumping)
id: a0af5df5-703d-4d2a-813f-ac33bf745b00
status: experimental
description: Detects another process opening a handle to lsass.exe memory, the core behaviour of credential-dumping
  tools. Requires Sysmon EID 10 (ProcessAccess) with lsass.exe included.
references:
- https://attack.mitre.org/techniques/T1003/001/
author: AlertMind capstone
date: 2026/06/26
tags:
- attack.credential-access
- attack.t1003.001
logsource:
  category: process_access
  product: windows
detection:
  selection:
    TargetImage|endswith: \lsass.exe
  filter:
    SourceImage|endswith:
    - \wininit.exe
    - \csrss.exe
    - \services.exe
  condition: selection and not filter
falsepositives:
- AV/EDR products and some system processes legitimately read LSASS; baseline and refine via GrantedAccess
level: high
