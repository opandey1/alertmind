title: SSH authorized_keys Modification (Persistence)
id: 2b7e1c4a-9f3d-4a6b-8c2e-5d1f0a9b7c34
status: experimental
description: Detects write/attribute changes to /root/.ssh/authorized_keys -- the precise behaviour of SSH
  authorized-keys persistence (appending an attacker-controlled key). Write/attr only, so it avoids the
  high-volume sshd login-read noise. Implemented via the auditd key set in detections/auditd/alertmind.rules.
references:
- https://attack.mitre.org/techniques/T1098/004/
- https://github.com/opandey1/alertmind (detections/auditd/alertmind.rules)
author: AlertMind capstone
date: 2026/06/26
tags:
- attack.persistence
- attack.t1098.004
logsource:
  product: linux
  service: auditd
detection:
  selection:
    key: t1098_004_authorized_keys
  condition: selection
falsepositives:
- Legitimate SSH key provisioning by administrators or configuration management
level: high
