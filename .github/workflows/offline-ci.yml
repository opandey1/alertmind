name: Offline CI

# SIEM- and model-provider-independent validation: no Wazuh, Ollama, OpenAI or
# Anthropic connection, no API keys and no repository secrets. Dependency
# installation still reaches PyPI.
#
# The job runs the assistant regression suite and then re-derives the
# CI-protected assistant-evaluation figures from committed artifacts, so
# changes affecting the protected results fail the build instead of silently
# moving a number in the report.
#
# Not covered here: MTTD, the assisted-timing study, manual grounding verdicts,
# dashboards and detection-rule counts. Those are evidenced elsewhere in the
# repository and are not asserted by this workflow.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  offline-validation:
    name: Tests and frozen evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: assistant/requirements-ci.lock

      - name: Install pinned dependencies
        run: |
          python -m pip install --require-hashes -r assistant/requirements-ci.lock
          python -m pip check

      - name: Run assistant regression suite
        working-directory: assistant
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Verify frozen evidence and canonical scoring
        run: python measurement/verify_frozen_evidence.py

      - name: Confirm validation did not modify committed evidence
        run: git diff --exit-code
