# AlertMind host-only, local-forward-only SSH transport.
# Installed as /etc/ssh/sshd_config.d/00-alertmind-transport.conf.
Port 22
AddressFamily inet
ListenAddress 192.168.56.102
HostKey /etc/ssh/ssh_host_ed25519_key

PermitRootLogin no
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthenticationMethods publickey
PermitEmptyPasswords no
AuthorizedKeysFile .ssh/authorized_keys
AllowUsers notroot@192.168.56.1

X11Forwarding no
AllowAgentForwarding no
AllowStreamLocalForwarding no
GatewayPorts no
PermitTunnel no
PermitUserEnvironment no
PermitUserRC no

# Fail closed for every identity unless an explicit Match block re-enables
# only the reviewed forwarding path.
AllowTcpForwarding no
PermitOpen none
ForceCommand /bin/false
PermitTTY no
MaxSessions 0

Match User notroot Address 192.168.56.1
    AllowTcpForwarding local
    PermitOpen 127.0.0.1:9200
    ForceCommand /bin/false
    PermitTTY no
    MaxSessions 0

# Do not let the conditional context leak into later included/main-file lines.
Match all
